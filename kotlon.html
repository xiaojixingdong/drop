/* ============================================================
   迷你 Kotlin 执行器（只支持第一章：println / print / 注释）
   ============================================================ */
function removeComments(code) {
  let result = "";
  let i = 0;
  let depth = 0;
  while (i < code.length) {
    if (depth > 0) {
      if (code[i] === "/" && code[i + 1] === "*") { depth++; i += 2; }
      else if (code[i] === "*" && code[i + 1] === "/") { depth--; i += 2; }
      else i++;
    } else {
      if (code[i] === "/" && code[i + 1] === "*") { depth++; i += 2; }
      else if (code[i] === "/" && code[i + 1] === "/") {
        while (i < code.length && code[i] !== "\n") i++;
      } else { result += code[i]; i++; }
    }
  }
  return result;
}

function hasNestedComment(code) {
  // 粗略检测：/* ... /* ... */ ... */
  const regex = /\/\*[^*]*\/\*[\s\S]*?\*\/[^*]*\*\//;
  return regex.test(code);
}

function executeKotlin(code) {
  const errors = [];
  if (/[“”]/.test(code)) errors.push('代码中出现了中文引号“ ”，Kotlin 必须使用英文半角引号 "');
  if (/[（）]/.test(code)) errors.push("代码中出现了中文括号（），Kotlin 必须使用英文半角括号 ()");
  if (!/fun\s+main\s*\(\s*\)/.test(code)) {
    errors.push("找不到 fun main()，程序没有入口");
  }

  let cleaned = removeComments(code);
  let output = "";
  const funcRegex = /\b(println|print)\s*\(/g;
  let match;
  while ((match = funcRegex.exec(cleaned)) !== null) {
    const funcName = match[1];
    let parenStart = match.index + match[0].length;
    let depth = 1;
    let j = parenStart;
    let inString = false;
    while (j < cleaned.length && depth > 0) {
      const c = cleaned[j];
      if (inString) {
        if (c === "\\") { j += 2; continue; }
        if (c === '"') inString = false;
      } else {
        if (c === '"') inString = true;
        else if (c === "(") depth++;
        else if (c === ")") depth--;
      }
      j++;
    }
    const args = cleaned.substring(parenStart, j - 1).trim();
    if (args === "") {
      if (funcName === "println") output += "\n";
    } else if (args.startsWith('"') && args.endsWith('"')) {
      let content = args.slice(1, -1);
      content = content.replace(/\\n/g, "\n").replace(/\\t/g, "\t").replace(/\\"/g, '"').replace(/\\\\/g, "\\");
      output += content;
      if (funcName === "println") output += "\n";
    } else {
      errors.push(`"${args}" 不是第一章能处理的表达式（第一章只支持打印字符串字面量）`);
    }
    funcRegex.lastIndex = j;
  }
  return { output, errors };
}

/* ============================================================
   渲染题目
   ============================================================ */
function renderAll() {
  const area = document.getElementById("questionArea");
  area.innerHTML = "";

  // 分组
  const groups = [
    { type: "choice", label: "一、选择题（每题 4 分，共 20 分）" },
    { type: "fill", label: "二、填空题（每题 5 分，共 15 分）" },
    { type: "subj", label: "三、简答题（每题 6 分，共 12 分）" },
    { type: "code", label: "四、编程题（每题 10 分，共 50 分）" }
  ];

  groups.forEach(g => {
    const qs = QUESTIONS.filter(q => q.type === g.type);
    if (qs.length === 0) return;

    const title = document.createElement("div");
    title.className = "section-title";
    title.textContent = g.label;
    area.appendChild(title);

    qs.forEach(q => {
      const div = document.createElement("div");
      div.className = "question";
      div.id = "q-" + q.id;

      let html = `<div class="q-head">
        <div class="q-title">${q.title}</div>
        <div class="score-tag">${q.score} 分</div>
      </div>`;

      if (q.type === "choice") {
        q.options.forEach((opt, i) => {
          html += `<label class="option" data-qid="${q.id}" data-idx="${i}">
            <input type="radio" name="${q.id}" value="${i}"> ${String.fromCharCode(65 + i)}. ${opt}
          </label>`;
        });
        html += `<div class="verdict" id="vd-${q.id}"></div>`;
      } else if (q.type === "fill") {
        html += `<input class="fill-input" id="fill-${q.id}" placeholder="${q.placeholder || '输入答案'}">`;
        html += `<div class="verdict" id="vd-${q.id}"></div>`;
      } else if (q.type === "subj") {
        html += `<textarea class="subj-textarea" id="subj-${q.id}" placeholder="在这里写下你的答案……"></textarea>`;
        html += `<button class="btn secondary" onclick="toggleRef('${q.id}')">对照参考答案</button>`;
        html += `<div class="ref-box" id="ref-${q.id}">${q.reference}</div>`;
        html += `<div class="verdict" id="vd-${q.id}" style="display:none;"></div>`;
      } else if (q.type === "code") {
        html += `<div class="expected-box"><span class="lbl">期望输出：</span>${q.expected}</div>`;
        html += `<div class="editor-wrap"><div class="editor" id="editor-${q.id}"></div></div>`;
        html += `<div class="action-row">
          <button class="btn primary" onclick="runCode('${q.id}')">▶ 运行并判定</button>
          <button class="btn secondary" onclick="resetCode('${q.id}')">重置代码</button>
        </div>`;
        html += `<div class="output-box" id="out-${q.id}" style="display:none;">
          <span class="lbl">实际输出</span><span class="val" id="out-val-${q.id}"></span>
        </div>`;
        html += `<div class="verdict" id="vd-${q.id}"></div>`;
        html += `<span class="hint-toggle" onclick="toggleHint('${q.id}')">💡 提示</span>`;
        html += `<div class="hint-box" id="hint-${q.id}">${q.hint}</div>`;
      }

      div.innerHTML = html;
      area.appendChild(div);
    });
  });

  // 选择题事件
  document.querySelectorAll(".option").forEach(el => {
    el.addEventListener("click", function () {
      const qid = this.dataset.qid;
      const idx = +this.dataset.idx;
      const q = QUESTIONS.find(x => x.id === qid);

      document.querySelectorAll(`.option[data-qid="${qid}"]`).forEach(o => {
        o.classList.remove("selected", "correct", "wrong");
      });
      this.classList.add("selected");

      const isCorrect = idx === q.correct;
      const fb = document.getElementById("vd-" + qid);
      if (isCorrect) {
        this.classList.add("correct");
        fb.className = "verdict pass";
        fb.textContent = "✓ 正确。" + q.explain;
      } else {
        this.classList.add("wrong");
        document.querySelectorAll(`.option[data-qid="${qid}"]`).forEach(o => {
          if (+o.dataset.idx === q.correct) o.classList.add("correct");
        });
        fb.className = "verdict fail";
        fb.textContent = "✗ 不对。" + q.explain;
      }

      state[qid].answered = true;
      state[qid].correct = isCorrect;
      state[qid].score = isCorrect ? q.score : 0;
      state[qid].data = { selected: idx, selectedText: q.options[idx] };
      updateProgress();
    });
  });

  // 填空题事件
  document.querySelectorAll(".fill-input").forEach(el => {
    el.addEventListener("blur", function () {
      const qid = this.id.replace("fill-", "");
      const q = QUESTIONS.find(x => x.id === qid);
      const val = this.value.trim();
      if (val === "") return;

      const isCorrect = val.toLowerCase() === q.answer.toLowerCase();
      this.classList.remove("correct", "wrong");
      this.classList.add(isCorrect ? "correct" : "wrong");

      const fb = document.getElementById("vd-" + qid);
      fb.className = "verdict " + (isCorrect ? "pass" : "fail");
      fb.textContent = isCorrect ? "✓ 正确。" + q.explain : "✗ 不对。正确答案是 " + q.answer + "。" + q.explain;

      state[qid].answered = true;
      state[qid].correct = isCorrect;
      state[qid].score = isCorrect ? q.score : 0;
      state[qid].data = { answer: val };
      updateProgress();
    });
  });

  // 简答题事件
  document.querySelectorAll(".subj-textarea").forEach(el => {
    el.addEventListener("blur", function () {
      const qid = this.id.replace("subj-", "");
      const val = this.value.trim();
      if (val === "") return;
      state[qid].answered = true;
      state[qid].data = { answer: val };
      // 简答题自评：默认给 0，用户可以手动勾选
      const fb = document.getElementById("vd-" + qid);
      fb.style.display = "block";
      fb.className = "verdict info";
      fb.innerHTML = '答完了？对照参考答案，如果觉得自己答对了，点这里自评：' +
        `<button class="btn primary" style="margin-left:8px;padding:4px 12px;font-size:12px;" onclick="selfGrade('${qid}',true)">✓ 我答对了</button>` +
        `<button class="btn secondary" style="margin-left:6px;padding:4px 12px;font-size:12px;" onclick="selfGrade('${qid}',false)">✗ 没答好</button>`;
    });
  });

  updateProgress();
}

function toggleRef(qid) {
  document.getElementById("ref-" + qid).classList.toggle("show");
}
function toggleHint(qid) {
  document.getElementById("hint-" + qid).classList.toggle("show");
}

function selfGrade(qid, passed) {
  const q = QUESTIONS.find(x => x.id === qid);
  const fb = document.getElementById("vd-" + qid);
  state[qid].correct = passed;
  state[qid].score = passed ? q.score : 0;
  fb.className = "verdict " + (passed ? "pass" : "fail");
  fb.textContent = passed ? "✓ 已自评：答对了。" : "✗ 已自评：没答好。";
  updateProgress();
}

/* ============================================================
   编程题运行与判定
   ============================================================ */
function runCode(qid) {
  const q = QUESTIONS.find(x => x.id === qid);
  const editor = window["editor_" + qid];
  const code = editor.getValue();

  const outBox = document.getElementById("out-" + qid);
  const outVal = document.getElementById("out-val-" + qid);
  const vd = document.getElementById("vd-" + qid);

  outBox.style.display = "block";
  vd.className = "verdict";
  vd.style.display = "none";

  const result = executeKotlin(code);

  if (result.errors.length > 0) {
    outVal.innerHTML = result.errors.map(e => `<span class="err">⚠ ${e}</span>`).join("\n");
    vd.className = "verdict fail";
    vd.style.display = "block";
    vd.textContent = "✗ 代码有错误，请先修正上面的问题。";
    state[qid].answered = true;
    state[qid].correct = false;
    state[qid].score = 0;
    state[qid].data = { code, output: result.output, errors: result.errors, passed: false, extraChecks: [] };
    updateProgress();
    return;
  }

  outVal.textContent = result.output.length === 0 ? "（没有输出）" : result.output;
  outVal.className = "val";

  const normalize = s => s.replace(/\r\n/g, "\n").replace(/\s+$/, "");
  const actual = normalize(result.output);
  const expected = normalize(q.expected);

  // 附加检查
  const extraResults = [];
  let extraPass = true;
  if (q.checks && q.checks.length > 0) {
    q.checks.forEach(c => {
      let ok = true;
      if (c.type === "singleComment") ok = /\/\//.test(code);
      else if (c.type === "multiComment") ok = /\/\*[\s\S]*?\*\//.test(code);
      else if (c.type === "nestedComment") ok = hasNestedComment(code);
      else if (c.type === "mustUsePrint") {
        const cleaned = removeComments(code);
        const regex = new RegExp(`print\\s*\\(\\s*"${c.arg}"\\s*\\)`);
        ok = regex.test(cleaned);
      }
      else if (c.type === "noChinesePunct") ok = !/[“”（）]/.test(code);
      else if (c.type === "allLower") ok = !/(^|[^a-zA-Z])(Fun|Main|Println)([^a-zA-Z]|$)/.test(code);
      extraResults.push({ type: c.type, pass: ok, msg: c.msg });
      if (!ok) extraPass = false;
    });
  }

  const outputPass = actual === expected;
  const passed = outputPass && extraPass;

  if (passed) {
    vd.className = "verdict pass";
    vd.style.display = "block";
    vd.textContent = "✓ 完全正确！输出与期望一致" + (q.checks.length ? "，附加检查也全部通过。" : "。");
  } else if (!outputPass) {
    vd.className = "verdict fail";
    vd.style.display = "block";
    vd.innerHTML = `✗ 输出不对。<br>你输出的是：<code>${JSON.stringify(actual)}</code><br>期望的是：<code>${JSON.stringify(expected)}</code>`;
  } else {
    vd.className = "verdict fail";
    vd.style.display = "block";
    const failedMsgs = extraResults.filter(r => !r.pass).map(r => "· " + r.msg).join("<br>");
    vd.innerHTML = `✗ 输出对了，但附加检查没过：<br>${failedMsgs}`;
  }

  state[qid].answered = true;
  state[qid].correct = passed;
  state[qid].score = passed ? q.score : 0;
  state[qid].data = {
    code,
    output: result.output,
    expected: q.expected,
    outputPass,
    extraPass,
    extraChecks: extraResults,
    passed
  };
  updateProgress();
}

function resetCode(qid) {
  const q = QUESTIONS.find(x => x.id === qid);
  window["editor_" + qid].setValue(q.initial);
  document.getElementById("out-" + qid).style.display = "none";
  document.getElementById("vd-" + qid).style.display = "none";
  document.getElementById("vd-" + qid).className = "verdict";
  state[qid].answered = false;
  state[qid].correct = false;
  state[qid].score = 0;
  state[qid].data = null;
  updateProgress();
}

/* ============================================================
   进度条 & 得分
   ============================================================ */
function updateProgress() {
  const bar = document.getElementById("progress");
  bar.innerHTML = "";
  let totalScore = 0, gotScore = 0;

  QUESTIONS.forEach(q => {
    const s = state[q.id];
    totalScore += q.score;
    if (s.answered) gotScore += s.score;

    const dot = document.createElement("div");
    dot.className = "dot";
    if (s.answered && s.correct) dot.classList.add("pass");
    else if (s.answered && !s.correct) dot.classList.add("partial");
    dot.title = q.id + "：" + (s.answered ? (s.correct ? "正确" : "错误") : "未作答");
    bar.appendChild(dot);
  });

  document.getElementById("scoreNum").textContent = gotScore;
  document.getElementById("totalNum").textContent = totalScore;
}

/* ============================================================
   导出 JSON
   ============================================================ */
function exportJSON() {
  const exportData = {
    meta: {
      title: "Kotlin 第一章练习作答记录",
      exportedAt: new Date().toISOString(),
      totalScore: 0,
      gotScore: 0
    },
    answers: {}
  };

  QUESTIONS.forEach(q => {
    const s = state[q.id];
    exportData.meta.totalScore += q.score;
    exportData.meta.gotScore += s.score;

    const item = {
      id: q.id,
      type: q.type,
      score: q.score,
      answered: s.answered,
      correct: s.correct,
      gotScore: s.score,
      title: q.title
    };

    if (s.data) {
      if (q.type === "choice") {
        item.selectedIndex = s.data.selected;
        item.selectedText = s.data.selectedText;
        item.correctIndex = q.correct;
        item.correctText = q.options[q.correct];
      } else if (q.type === "fill") {
        item.userAnswer = s.data.answer;
        item.standardAnswer = q.answer;
      } else if (q.type === "subj") {
        item.userAnswer = s.data.answer;
        item.selfGrade = s.correct;
        item.reference = q.reference.replace(/<[^>]+>/g, "");
      } else if (q.type === "code") {
        item.code = s.data.code;
        item.actualOutput = s.data.output;
        item.expectedOutput = s.data.expected || q.expected;
        item.outputPass = s.data.outputPass;
        item.extraPass = s.data.extraPass;
        item.extraChecks = s.data.extraChecks;
        item.passed = s.data.passed;
      }
    }
    exportData.answers[q.id] = item;
  });

  const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "kotlin-ch1-answers-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============================================================
   Monaco Editor 初始化
   ============================================================ */
function initMonaco() {
  monaco.languages.register({ id: "kotlin" });

  monaco.languages.setMonarchTokensProvider("kotlin", {
    keywords: ["fun", "val", "var", "if", "else", "when", "for", "while", "return", "true", "false", "null", "class", "object", "import", "package"],
    tokenizer: {
      root: [
        [/\/\/.*$/, "comment"],
        [/\/\*/, "comment", "@comment"],
        [/".*?"/, "string"],
        [/[a-zA-Z_]\w*/, { cases: { "@keywords": "keyword", "@default": "identifier" } }],
        [/\d+/, "number"],
        [/[{}()\[\]]/, "@brackets"],
      ],
      comment: [
        [/[^/*]+/, "comment"],
        [/\*\//, "comment", "@pop"],
        [/[/*]/, "comment"]
      ]
    }
  });

  monaco.languages.registerCompletionItemProvider("kotlin", {
    provideCompletionItems: function (model, position) {
      const word = model.getWordUntilPosition(position);
      const range = {
        startLineNumber: position.lineNumber,
        endLineNumber: position.lineNumber,
        startColumn: word.startColumn,
        endColumn: word.endColumn
      };
      const suggestions = [
        { label: "fun", kind: monaco.languages.CompletionItemKind.Keyword, insertText: "fun ", detail: "定义函数", range },
        { label: "main", kind: monaco.languages.CompletionItemKind.Function, insertText: "main() {\n\t$0\n}", insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet, detail: "程序入口", range },
        { label: "println", kind: monaco.languages.CompletionItemKind.Function, insertText: 'println("$0")', insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet, detail: "打印并换行", range },
        { label: "print", kind: monaco.languages.CompletionItemKind.Function, insertText: 'print("$0")', insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet, detail: "打印不换行", range }
      ];
      return { suggestions };
    }
  });

  QUESTIONS.filter(q => q.type === "code").forEach(q => {
    const el = document.getElementById("editor-" + q.id);
    const editor = monaco.editor.create(el, {
      value: q.initial,
      language: "kotlin",
      theme: "vs-dark",
      fontSize: 14,
      minimap: { enabled: false },
      automaticLayout: true,
      scrollBeyondLastLine: false,
      lineNumbers: "on",
      tabSize: 4,
      renderWhitespace: "selection",
      suggestOnTriggerCharacters: true,
      quickSuggestions: { other: true, comments: false, strings: false },
      wordBasedSuggestions: true,
    });
    window["editor_" + q.id] = editor;
  });
}

/* ============================================================
   启动
   ============================================================ */
renderAll();
require.config({ paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs" } });
require(["vs/editor/editor.main"], function () {
  initMonaco();
});
</script>
